name: CI

on:
  push:
    branches: [main, security-fixes]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Each suite starts its own in-memory MongoDB and its own copy of the server on its
      # own port, so no database or other service is needed here.
      - name: Run end-to-end tests
        working-directory: backend
        run: npm test
        env:
          # The suites set their own secret, but the server refuses to start without one
          JWT_SECRET: ${{ '0123456789abcdef0123456789abcdef0123456789abcdef' }}

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
