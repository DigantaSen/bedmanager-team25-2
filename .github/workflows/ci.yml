name: CI

on:
  push:
    branches: [main, security-fixes]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # The forecasting suite starts the real ML service, so it needs Python and the
      # service's dependencies. The trained models are in the repository; only the
      # virtual environment is not, which is why the suite looks for an interpreter
      # rather than assuming one exists.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install ML service dependencies
        run: pip install -r ml-service/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # The report suite renders a real PDF, which needs a browser. reportService already
      # launches Chrome with --no-sandbox, which is what a CI container requires.
      - name: Install Chrome for puppeteer
        working-directory: backend
        run: npx puppeteer browsers install chrome

      # Each suite starts its own in-memory MongoDB and its own copy of the server on its
      # own port, so no database or other service is needed here.
      # No JWT_SECRET is set here on purpose. Each suite supplies its own throwaway secret
      # before starting the server, so nothing secret-shaped needs to live in this file.
      - name: Run end-to-end tests
        working-directory: backend
        run: npm test
        env:
          # Use the interpreter this job just set up
          ML_PYTHON: python

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
